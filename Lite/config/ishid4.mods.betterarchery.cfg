## Settings file was created by plugin Better Archery v2.0.2
## Plugin GUID: ishid4.mods.betterarchery

[Arrow Improvements]

## Arrow improvements including aim problems fixes, gravity changes.
# Setting type: Boolean
# Default value: true
Enable Arrow Improvements = true

## Change the arrow's velocity. Vanilla is '60'.
# Setting type: Single
# Default value: 70
Set Arrow Velocity = 70

## Change the arrow's gravity. Vanilla is '5'.
# Setting type: Single
# Default value: 15
Set Arrow Gravity = 15

## Change the arrow's accuracy. Vanilla is '-1'.
# Setting type: Single
# Default value: 0
Set Arrow Accuracy = 0

## Change the aim direction. Vanilla is 'x:0.0, y:0.0, z: 0.0'.
# Setting type: Vector3
# Default value: {"x":0.0,"y":0.05000000074505806,"z":0.0}
Set Aim Direction = {"x":0.0,"y":0.05000000074505806,"z":0.0}

[Bow Zoom]

## Enable the zooming with bow.
# Setting type: Boolean
# Default value: true
Enable Bow Zoom = true

## Zoom while drawing bow automatically.
# Setting type: Boolean
# Default value: false
Automatic Bow Zoom = false

## Sound effects for zoom-in and zoom-out.
# Setting type: Boolean
# Default value: true
Enable Bow Zoom SFX = true

## Max zoom.
# Setting type: Single
# Default value: 2
Zoom Factor = 2

## Change this value to '-1' if you don't want constant time while zooming. '1' is recommended.
# Setting type: Single
# Default value: -1
Bow Zoom Constant Time = -1

## Mouse0: Left Click, Mouse1: Right Click, Mouse2: Middle Click. For the other inputs: https://docs.unity3d.com/ScriptReference/KeyCode.html
# Setting type: KeyboardShortcut
# Default value: Mouse1
Bow Zoom Hotkey = Mouse1

## Mouse0: Left Click, Mouse1: Right Click, Mouse2: Middle Click. For the other inputs: https://docs.unity3d.com/ScriptReference/KeyCode.html
# Setting type: KeyboardShortcut
# Default value: E
Bow Draw Cancel Hotkey = E

## When enabled, the Bow Draw Cancel Hotkey cancels bow drawing. Disable to restore vanilla cancel behavior.
# Setting type: Boolean
# Default value: true
Enable Bow Draw Cancel = true

## Gamepad button that cancels bow drawing (ZInput button name). Empty to disable gamepad cancel. Requires 'Enable Bow Draw Cancel'.
# Setting type: String
# Default value: JoyBlock
Bow Draw Cancel Gamepad Button = JoyBlock

## Set the max time of staying on zoom while holding RMB after releasing an arrow.
# Setting type: Single
# Default value: 2
Stay In-Zoom Time = 2

[Other]

## You can hide your crosshair.
# Setting type: Boolean
# Default value: true
Enable Crosshair = true

## You can hide your circle bow crosshair.
# Setting type: Boolean
# Default value: true
Enable Bow Crosshair = true

## Show sneak damage at top left.
# Setting type: Boolean
# Default value: true
Enable Sneak Damage Showing = true

## Set walk speed while drawing bow.
# Setting type: Boolean
# Default value: true
Enable Bow Draw Movement Speed Reduction = true

## Keep the character crouched while drawing a bow.
# Setting type: Boolean
# Default value: true
Enable Crouch Bow Draw = true

## Show the selected arrow model nocked on the bow string while drawing.
# Setting type: Boolean
# Default value: true
Enable Nocked Arrow = true

## Enable to crafting wooden arrows without a crafting table.
# Setting type: Boolean
# Default value: true
Enable Crafting Wooden Arrow Everywhere = true

## Nexus mod ID for updates.
# Setting type: Int32
# Default value: 348
NexusID = 348

## 0: Nothing, 1: Only Errors, 2: Errors and Warnings, 3: Everything
# Setting type: Int32
# Default value: 1
Set Debug Log Level = 1

[Quiver]

## Enable the quiver. Don't change this value while in the game. If you disable this while arrows are in the quiver, you will LOSE ALL OF THEM!
# Setting type: Boolean
# Default value: true
Enable Quiver = true

## Change quiver slot inventory location. For 'More Slots' you can use this location, 'x:3.0, y:-167.0'.
# Setting type: Vector2
# Default value: {"x":3.0,"y":-25.0}
Change location of inventory quiver slot = {"x":3.0,"y":-25.0}

## Change quiver slot inventory location when a chest opened.
# Setting type: Vector2
# Default value: {"x":3.0,"y":-425.0}
Change location of inventory quiver slot when a chest opened = {"x":3.0,"y":-425.0}

## Change the quiver model rotation. Default is 'x:270.0, y:90.0, z:-10.0'
# Setting type: Vector3
# Default value: {"x":270.0,"y":90.0,"z":-10.0}
Change Quiver Model Rotation = {"x":270.0,"y":90.0,"z":-10.0}

## Change the quiver model scale. Default is 'x:2.0, y:2.0, z:2.0'
# Setting type: Vector3
# Default value: {"x":2.0,"y":2.0,"z":2.0}
Change Quiver Model Scale = {"x":2.0,"y":2.0,"z":2.0}

## Change the quiver model position. Default is 'x:0.001, y:0.0, z:0.003'
# Setting type: Vector3
# Default value: {"x":0.0010000000474974514,"y":0.0,"z":0.003000000026077032}
Change Quiver Model Position = {"x":0.0010000000474974514,"y":0.0,"z":0.003000000026077032}

## Enable the quiver's hotbar on the screen/hud. This doesn't affect inventory.
# Setting type: Boolean
# Default value: true
Enable Quiver Hud = true

## Size of the quiver HUD slots.
# Setting type: Single
# Default value: 0.7
Quiver Hud Scale = 0.7

## Change the quiver HUD position. Default is 'x:-5.0, y:180'
# Setting type: Vector2
# Default value: {"x":-5.0,"y":180.0}
Quiver Hud Position Offset = {"x":-5.0,"y":180.0}

## Layout of the quiver HUD slots: a horizontal row or a vertical column.
# Setting type: QuiverHudOrientation
# Default value: Horizontal
# Acceptable values: Horizontal, Vertical
Quiver Hud Orientation = Horizontal

## Change holding key. For the inputs: https://docs.unity3d.com/ScriptReference/KeyCode.html
# Setting type: KeyboardShortcut
# Default value: LeftAlt
Quiver slot hotkey holding key = LeftAlt

## Hotkey for Quiver Slot 1. For the inputs: https://docs.unity3d.com/ScriptReference/KeyCode.html
# Setting type: KeyboardShortcut
# Default value: Alpha1
Quiver slot hotkey 1 = Alpha1

## Hotkey for Quiver Slot 2. For the inputs: https://docs.unity3d.com/ScriptReference/KeyCode.html
# Setting type: KeyboardShortcut
# Default value: Alpha2
Quiver slot hotkey 2 = Alpha2

## Hotkey for Quiver Slot 3. For the inputs: https://docs.unity3d.com/ScriptReference/KeyCode.html
# Setting type: KeyboardShortcut
# Default value: Alpha3
Quiver slot hotkey 3 = Alpha3

[Retrievable Arrows]

## Enable the retrievable arrows.
# Setting type: Boolean
# Default value: true
Enable Retrievable Arrows = true

## Set arrow's disappear countdown time.
# Setting type: Single
# Default value: 60
Arrow Disappear Time = 60

## Make non-retrievable arrows disappear on hit.
# Setting type: Boolean
# Default value: false
Arrow Disappear On Hit = false

## Let players stand on retrievable arrows stuck in the ground.
# Setting type: Boolean
# Default value: false
Retrievable Arrow Solid Collider = false

## Automatically pick up near arrows when they are retrievable.
# Setting type: Boolean
# Default value: false
Arrow Auto Pickup = false

