Defaults:
  Protection:
    PlayerBuiltPiece:
      Action: Block
      Ignored:
      - fire_pit
    Tombstone: Block
    Ward: Block
    Portal: Block
    Bed: Block
    Container: Block
    TamedCreature: Block
    DroppedItem: Preserve
    PlayerBaseEffect: Block
