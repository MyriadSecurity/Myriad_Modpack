## Settings file was created by plugin QuickTeleport v2.0.4
## Plugin GUID: elg.QuickTeleport

[Dungeons]

## Uses the dungeon profile below. Turn this Off to keep vanilla dungeon timing. [Server synchronized]
# Setting type: Boolean
# Default value: true
Enable Faster Dungeons = true

## Seconds used for the dungeon fade in and fade out. [Local only]
# Setting type: Single
# Default value: 0.2
# Acceptable value range: From 0 to 2
Dungeon Fade Time = 0.2

## Extra time to wait after a dungeon has loaded. Leave at 0 for the fastest normal dungeon transition. [Local only]
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 5
Dungeon Load Safety Delay = 0

[General]

## When On, the server's gameplay settings are enforced for connected clients. [Server synchronized]
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
Force Server Config = On

## Master switch for all QuickTeleport behavior. [Server synchronized]
# Setting type: Boolean
# Default value: true
Enable Quick Teleport = true

## Writes one summary for each completed teleport. Intended for troubleshooting only. [Local only]
# Setting type: Boolean
# Default value: false
Enable Teleport Diagnostics = false

[Portals]

## Uses the portal profile below. Turn this Off to keep vanilla portal timing. [Server synchronized]
# Setting type: Boolean
# Default value: true
Enable Faster Portals = true

## Seconds used for the portal fade in and fade out. [Local only]
# Setting type: Single
# Default value: 0.2
# Acceptable value range: From 0 to 2
Portal Fade Time = 0.2

## Extra time to wait after the destination has loaded before revealing a portal. Leave at 0.50 unless remote bases still appear late. [Local only]
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0 to 5
Portal Load Safety Delay = 0.5

[Safety]

## Choose what must load before arrival: FullWorld (recommended; terrain and objects), TerrainOnly (faster; objects may appear late), or Immediate (fastest; world may still load). [Local only]
# Setting type: ArrivalSafety
# Default value: FullWorld
# Acceptable values: FullWorld, TerrainOnly, Immediate
Arrival Safety = FullWorld

