[Raids]

## Reverts to use vanilla raid configuration when enabled. Server authoritative: on a dedicated or player hosted server the server's value is synced to every client, so editing this in a client's own config file has no effect.
# Setting type: Boolean
# Default value: false
UseVanillaRaidConfiguration = false

## The rate at which raid events occur (Vanilla is 1.0), higher values result in less frequent raids, lower values results in more frequent raids. This modifies the raid timing settings which are set per-raid.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0.001 to 10
RaidEventRate = 1

## The Maximum number of times to try to activate a raid for a given player. The available raids will be shuffled each time before rolling their activation chance. With 10 raids defined the randomly selected first X will get a chance to spawn.
# Setting type: Int32
# Default value: 5
# Acceptable value range: From 0 to 50
MaxRaidAttemptsPerPlayer = 1

## Number of minutes between when the server will check to start raids (raids can still be on cooldown and will not be started).
# Setting type: Int32
# Default value: 25
# Acceptable value range: From 1 to 120
ServerTimeBetweenRaidStartChecks = 46

## Which clock raid cooldowns are measured against. WorldTime is the world's own time, which advances whenever anyone is playing the world and jumps forward when someone sleeps through a night, so a player's cooldown keeps burning down while other people play without them. PlayerTime is each player's own time in the world: a cooldown only counts down while that player is actually online, so logging out with 20 minutes left brings them back with 20 minutes left no matter how long they were away. Neither clock runs while nobody is playing. Switching between them re-bases everyone's remaining cooldown, so nobody gains or loses raid time by the switch.
# Setting type: String
# Default value: WorldTime
# Acceptable values: WorldTime, PlayerTime
RaidCooldownClock = WorldTime

## The maximum number of concurrent raids, automatically limited to 1 per player.
# Setting type: Int32
# Default value: 10
# Acceptable value range: From 1 to 150
MaxActiveRaids = 10

## Seconds after a raid ends during which its creatures move away and despawn naturally. 0 = no linger.
# Setting type: Int32
# Default value: 60
# Acceptable value range: From 0 to 600
RaidWindDownSeconds = 60

## When enabled, any raid creatures still present at the end of RaidWindDownSeconds are force-deleted. When disabled, leftover creatures are left to wander off and despawn on their own.
# Setting type: Boolean
# Default value: true
RaidForceDeleteStragglers = true

## No raid starts within this many meters of a raid that is already running or winding down, whoever it belongs to and however it was started: the first raid in an area is the only raid. Applies to force-started raids too. 0 disables the check.
# Setting type: Single
# Default value: 500
# Acceptable value range: From 0 to 5000
RaidExclusionRange = 500

## Only for raids with RaidActiveTillDefeated set in RaidSettings.yaml. Once such a raid's Duration has elapsed it stays active until its remaining creatures are dead, for at most this many seconds; then it winds down regardless, so a straggler stuck somewhere cannot hold a raid open forever. 0 winds every raid down as soon as its Duration elapses.
# Setting type: Int32
# Default value: 300
# Acceptable value range: From 0 to 3600
RaidActiveTillDefeatedMaxSeconds = 300

## When CustomRaids is installed and SLS raids are enabled, allow CustomRaids raids to fire alongside SLS raids. Has no effect if CustomRaids is not installed.
# Setting type: Boolean
# Default value: true
EnableCustomRaidsCompat = true

