BossHudTopBuffer = 120

## [Client side Config] Boss health bar width as a fraction of the screen width.
# Setting type: Single
# Default value: 0.4
# Acceptable value range: From 0.1 to 1
BossHealthbarWidthPercent = 0.4

## When Jewelcrafting is installed, suppress its multi-boss HUD layout (which rescales the boss health bar every frame) so SLS controls the boss healthbars. Has no effect if Jewelcrafting is not installed.
# Setting type: Boolean
# Default value: true
EnableJewelcraftingBossHudCompat = true

[ZoneScaling]

## Divides the world into island-based zones. Zones gain levels from creature kills and apply bonus level-up chances to creatures that spawn inside them.
# Setting type: Boolean
# Default value: true
EnableZoneScalingBonus = true

## How much each zone level above 1 multiplies the level-up chances of creatures spawning in that zone. The multiplier is 1 + (zone level - 1) x this value: 1.0 doubles the chances at zone level 2 and triples them at zone level 3. 0 turns the zone bonus off.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 10
ZoneLevelBonusPerLevel = 1

## Number of creature deaths in a zone required to raise that zone's level by 1.
# Setting type: Int32
# Default value: 100
# Acceptable value range: From 1 to 10000
ZoneKillsPerLevelUp = 100

## How many zone levels decay per hour. 0 disables decay entirely; lower values decay slower, higher values faster. Default 0.25 = one level lost every four hours. Whether that hour is wall-clock time or time actually spent in the world is set by ZoneDecayClock.
# Setting type: Single
# Default value: 0.25
# Acceptable value range: From 0 to 50
ZoneDecayLevelsPerHour = 0.25

## Which clock zone level decay is measured against. RealTime is the wall clock, so zones keep decaying while nobody is playing and a world left alone overnight comes back several levels lower. GameTime is the world's own time, which only advances while the world is actually being played, so nothing decays while you are logged out or while a dedicated server sits empty. Switching between them re-bases every zone's decay timer within 15 minutes; zone levels themselves are never lost by the switch.
# Setting type: String
# Default value: RealTime
# Acceptable values: RealTime, GameTime
ZoneDecayClock = RealTime

## Draws zone boundaries on the minimap, colored by zone level.
# Setting type: Boolean
# Default value: true
EnableZoneMapOverlay = false

## When enabled, zone boundaries draw above the map fog so they are visible even in unexplored areas. When disabled, boundaries sit below the fog and only appear once an area has been explored.
# Setting type: Boolean
# Default value: false
ZoneOverlayAboveFog = false

## Minimum landmass size (meters, on both axes) for an island to be split into zones. Islands smaller than this get no zones. Changes apply when zones are rebuilt (sls-zone-rebuild).
# Setting type: Single
# Default value: 1000
# Acceptable value range: From 500 to 10000
MinZoneSize = 1000

## Side length (meters) of each square zone cell. Land is tiled onto a global grid of this size so zones never overlap. Changes apply when zones are rebuilt (sls-zone-rebuild).
# Setting type: Single
# Default value: 3000
# Acceptable value range: From 1000 to 10000
MaxZoneSize = 3000

## The number of seconds between update checks for zone kill counters.
# Setting type: Single
# Default value: 10
# Acceptable value range: From 1 to 150
KillReportFlushIntervalSeconds = 10

## The colors used for zone boundaries on the minimap, walked by zone level (higher levels step further along the list, wrapping if there are more levels than colors). (Optional, use an HTML hex color starting with # to have a custom color.) Available options: LightYellow, Yellow, LightOrange, Orange, DarkOrange, LightRed, Red, DarkRed, LightPurple, Purple, DarkPurple, Green, Teal, Blue, Pink, Gray, Brown, Black, White
# Setting type: String
# Default value: Grey,White,LightYellow,Yellow,LightOrange,Orange,DarkOrange,LightRed,Red,DarkRed,LightPurple,Purple,DarkPurple
ZoneOverlayColorOptions = Grey,White,LightYellow,Yellow,LightOrange,Orange,DarkOrange,LightRed,Red,DarkRed,LightPurple,Purple,DarkPurple

## Transparency value of the color used for zone boundaries.
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0 to 1
ZoneOverlayColorTransparency = 0.5

