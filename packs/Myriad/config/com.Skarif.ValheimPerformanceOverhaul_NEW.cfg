[0. Compatibility Guard]

## Автоматически анализирует хуки сторонних модов и отключает конфликтующие подсистемы VPO во избежание сбоев.
# Setting type: Boolean
# Default value: true
Enable Smart Conflict Guard = true

## Чувствительность детектора конфликтов:
## - Conservative: отключает модули при сторонних Prefix/Transpiler.
## - Aggressive: отключает при любом стороннем хуке.
## - KnownOnly: только по базе модов.
# Setting type: ConflictSensitivity
# Default value: Conservative
# Acceptable values: Conservative, Aggressive, KnownOnly
Conflict Detection Sensitivity = Conservative

## Выводить в консоль подробные отчеты об обнаруженных и предотвращенных конфликтах.
# Setting type: Boolean
# Default value: true
Log Conflict Resolutions = true

[0. Optimization Preset]

## Optimization template:
## - Normal: balanced mod defaults.
## - Potato: maximum performance for low-end PCs.
## - High: maximum quality (closest to vanilla).
# Setting type: OptimizationPreset
# Default value: Normal
# Acceptable values: Normal, Potato, High
Active Preset Profile = Normal

