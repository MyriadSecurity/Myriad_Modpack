# Setting type: Boolean
# Default value: false
Enable Heightmap Settings = false

## How high you can stack up relative to the heightmap's original position.
## Please be very careful with this!
##  [Not Synced with Server]
# Setting type: Single
# Default value: 200
Max Height = 200

## How far you can dig down relative to the heightmap's original position.
## Please be very careful with this!
##  [Not Synced with Server]
# Setting type: Single
# Default value: -200
Min Height = -200

