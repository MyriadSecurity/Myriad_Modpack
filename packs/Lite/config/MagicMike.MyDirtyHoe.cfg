[7 - Misc Settings]

## Enable durability drain for the hoe.
##  [Synced with Server]
# Setting type: Boolean
# Default value: true
Enable Durability Drain = true

## Enable stamina usage for the hoe.
##  [Synced with Server]
# Setting type: Boolean
# Default value: true
Enable Stamina Usage = true

## Enable resource costs for the hoe.
## Applies to raising terrain, paving terrain, placed stones and rocks, and the ramp.
## (Restart required).
##  [Synced with Server]
# Setting type: Boolean
# Default value: true
Enable Resource Costs = true

## Enable requirement of stone-cutter workbench for paving terrain.
##  [Synced with Server]
# Setting type: Boolean
# Default value: true
Workbench Requirement = true

## Use the Circle or Square shape when flattening terrain.
##  [Not Synced with Server]
# Setting type: Shape
# Default value: Square
# Acceptable values: Circle, Square
Flatten Tool Shape = Square

## Use the Circle or Square shape when raising or lowering terrain.
## Circle rises highest in the middle and slopes off to the edge; Square raises the whole area.
##  [Not Synced with Server]
# Setting type: Shape
# Default value: Square
# Acceptable values: Circle, Square
Raise and Lower Tool Shape = Square

## Use the Circle or Square shape for the Reset Terrain piece and the Reset Hotkey.
## Square shows a grid like the square flatten tool.
##  [Not Synced with Server]
# Setting type: Shape
# Default value: Square
# Acceptable values: Circle, Square
Reset Tool Shape = Square

## Hotkey to switch the Flatten, Raise and Lower, and Reset tool shapes between Circle and Square while holding the hoe.
## All three switch together.
## Use one key, or join keys with +, for example LeftControl + G. Set to None to turn it off.
##  [Not Synced with Server]
# Setting type: KeyboardShortcut
# Default value: S + LeftAlt
Shape Toggle Hotkey = S + LeftAlt

## How thickly the clutter brushes in the Paint category paint.
## 1 is the game's normal clutter density, higher is denser.
## Only applies to clutter painted after the change.
##  [Synced with Server]
# Setting type: Single
# Default value: 2
# Acceptable value range: From 0.25 to 8
Clutter Brush Density = 2

## Hotkey to undo the last terrain change made with the Dirty Hoe while holding it.
## Covers the terrain tools, the ramp, the Reset Terrain piece and the Reset Hotkey. Resources and durability are not given back.
## Use one key, or join keys with +, for example LeftAlt + Z. Set to None to turn it off.
##  [Not Synced with Server]
# Setting type: KeyboardShortcut
# Default value: Z + LeftAlt
Undo Hotkey = Z + LeftAlt

## How many terrain changes are remembered for the Undo Hotkey.
## The history is cleared when you leave the world.
##  [Not Synced with Server]
# Setting type: Int32
# Default value: 5
# Acceptable value range: From 1 to 20
Undo Steps = 5

