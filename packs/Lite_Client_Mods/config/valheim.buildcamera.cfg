## Settings file was created by plugin Valheim Build Camera v0.1.22
## Plugin GUID: valheim.buildcamera

[Building]

## Base reach from your character's eyes, multiplied by FreeCameraRangeMultiplier only while free camera is active. Default 25 x 2 = 50 metres. Normal player reach is restored on exit; native building rules still apply.
# Setting type: Single
# Default value: 25
# Acceptable value range: From 5 to 25
BuildReach = 25

[Camera]

## Camera movement in metres per second.
# Setting type: Single
# Default value: 6
# Acceptable value range: From 1 to 15
MoveSpeed = 6

## Hold your Run control for faster camera movement.
# Setting type: Single
# Default value: 2
# Acceptable value range: From 1 to 3
FastMultiplier = 2

## Base camera radius in metres, multiplied by FreeCameraRangeMultiplier. Default 25 x 2 = 50 metres around the stationary body. Existing base settings are retained.
# Setting type: Single
# Default value: 25
# Acceptable value range: From 8 to 25
CameraRadius = 25

## Multiply both base camera radius and active build reach. New default 2 doubles existing settings without repeatedly changing the saved base values. Set 1 for the previous range. Does not affect normal player building reach.
# Setting type: Single
# Default value: 2
# Acceptable value range: From 1 to 2
FreeCameraRangeMultiplier = 2

[Controls]

## Enter/leave build camera with a hammer or another building tool equipped.
# Setting type: KeyboardShortcut
# Default value: F6
ToggleKey = F6

## Reset the active camera to its initial angled view.
# Setting type: KeyboardShortcut
# Default value: F7
ResetViewKey = F7

## Write camera diagnostics, exit camera mode, and reload configuration. Separate from Larger HUD's F8.
# Setting type: KeyboardShortcut
# Default value: F10
ReloadAndReportKey = F10

## Press both stick buttons together to enter/leave. A building tool is needed to enter, but not to leave. Release both before toggling again.
# Setting type: Boolean
# Default value: true
ControllerStickToggle = true

[General]

## Enable the build camera on this client.
# Setting type: Boolean
# Default value: true
Enabled = true

[Safety]

## Exit immediately when the physical player takes damage. Set false only if you deliberately want environmental damage to be tolerated; death still exits.
# Setting type: Boolean
# Default value: true
ExitOnDamage = true

[View]

## Hide your character's renderers on your own screen while active. Your body remains in the world.
# Setting type: Boolean
# Default value: true
HideLocalPlayer = true

## Small top-centre reminder while the build camera is active.
# Setting type: Boolean
# Default value: true
ShowIndicator = true

## Downward angle when entering/resetting the camera. Mouse/right stick can adjust it afterward.
# Setting type: Single
# Default value: 50
# Acceptable value range: From 20 to 75
StartingPitch = 50

## Starting perspective field of view. Page Up/Down zoom while active; mouse wheel keeps rotating pieces.
# Setting type: Single
# Default value: 45
# Acceptable value range: From 25 to 75
FieldOfView = 45

