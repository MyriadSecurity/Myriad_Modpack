# LoadTimeProfiler configuration. Missing settings use their current or default values.
# Logging changes reload automatically. Other changes require a restart.
# Invalid values keep that setting's current or default value; unknown entries are ignored.
# Reload never writes this file; UI edits preserve unrelated lines.

[General]
ProfilingEnabled = true
LocalizationCacheEnabled = true
ConfigWriteCoalescingEnabled = true
# Reload other mods' BepInEx cfg files after local file edits. Restart required.
# Each mod determines whether its changed values take effect during play.
ConfigAutoReloadEnabled = false
# Set to 0 to disable the timeout floor. Longer original timeouts are retained.
TimeoutProtectionSeconds = 120

[Logging.Mods]
# Exact, case-sensitive plugin GUIDs. Unlisted plugins use Errors, Warnings.
# Groups: Errors (Fatal + Error), Warnings, Information (Message + Info), Debug.
# Use None to disable a mod's default logger; combine group names with commas.
# Unity and unattributed/custom loggers pass through unchanged.
# author.examplemod = Errors, Warnings
