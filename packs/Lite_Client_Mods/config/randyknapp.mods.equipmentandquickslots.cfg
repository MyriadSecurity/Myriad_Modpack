## Settings file was created by plugin Equipment and Quick Slots v3.1.3
## Plugin GUID: randyknapp.mods.equipmentandquickslots

[Compatibility]

## Host Better Archery's quiver as three ammo slots in the equipment panel instead of letting it add its own inventory rows. Turn this off to disable Better Archery's quiver entirely; the quick slots hold ammo just as well. Takes effect on restart.
# Setting type: Boolean
# Default value: true
Better Archery quiver integration = true

[Equipment Panel]

## Position of the equipment and quick slot panel, relative to the inventory grid. Drag the panel by its background in-game to move it (hold the drag key, or enable 'Equipment Panel Draggable').
# Setting type: Vector2
# Default value: {"x":615.0,"y":28.0}
Equipment Panel Position = {"x":615.0,"y":28.0}

## Allow dragging the panel by its background at any time, without holding the drag key.
# Setting type: Boolean
# Default value: false
Equipment Panel Draggable = false

## Hold this key while dragging the panel background to move the panel.
# Setting type: KeyboardShortcut
# Default value: LeftAlt
Equipment Panel Drag Key = LeftAlt

## Draw the character paperdoll image behind the equipment slots.
# Setting type: Boolean
# Default value: false
Show Paperdoll = false

[Equipment Slots]

## Draw the second and third utility items on the character model. The first utility item is drawn by the game either way.
# Setting type: Boolean
# Default value: true
Show extra utility items = true

## Number of utility items (belts, the Wishbone, Megingjord) that may be worn at once. The game itself allows one; raising this is a balance change. You can never wear two copies of the same item.
# Setting type: Int32
# Default value: 1
# Acceptable value range: From 1 to 3
Utility Slot Count = 1

[Gravestone]

## If set to true, your equipped items stay with you when you die instead of dropping into the gravestone.
# Setting type: Boolean
# Default value: false
Dont drop equipment on death = false

## True: picking up your gravestone instantly re-equips the armor that was in your equipment slots (no equip animation). False: the armor is returned to its slots but left unequipped until you equip it. Only valid when Equipment Slots are enabled.
# Setting type: Boolean
# Default value: true
Instantly re-equip armor on pickup = true

## If set to true, belts and other carry-weight gear from your gravestone are equipped immediately on pickup so the rest of the loot stays carryable.
# Setting type: Boolean
# Default value: true
Auto-equip carry weight items on pickup = true

## If set to true, the weapon and shield you were holding when you died are re-equipped when you pick up your gravestone.
# Setting type: Boolean
# Default value: true
Auto-equip weapon and shield on pickup = true

## If set to true, the items in the quickslots stay with you when you die instead of dropping into the gravestone.
# Setting type: Boolean
# Default value: false
Dont drop quickslot items on death = false

