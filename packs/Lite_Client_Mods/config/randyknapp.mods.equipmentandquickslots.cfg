[Inventory]

## Additional visible inventory rows on top of the game's four. The equipment and quick slots move down with the grid.
# Setting type: Int32
# Default value: 0
# Acceptable value range: From 0 to 5
Extra Inventory Rows = 0

## The player's base carry weight before belts and other modifiers. 300 is the game default and leaves other mods' carry-weight changes untouched.
# Setting type: Single
# Default value: 300
# Acceptable value range: From 50 to 5000
Base Carry Weight = 300

[Logging]

## Enable logging.
# Setting type: Boolean
# Default value: false
Logging Enabled = false

[Protections]

## Items in equipment and quick slots are not moved by the container Stack All button.
# Setting type: Boolean
# Default value: true
Prevent Stack All = true

## Picked up items never land directly in a quick slot; they go to the regular inventory only.
# Setting type: Boolean
# Default value: false
Prevent auto-pickup into quick slots = false

## Automatically back up equipment and quick slot contents into the character save on every save, and restore them when the slots load empty (e.g. after the mod was temporarily removed).
# Setting type: Boolean
# Default value: true
Slots backup enabled = true

[Quick Slots]

## The point on the HUD to anchor the Quick Slots bar. Changing this also changes the pivot of the Quick Slots to that corner.
# Setting type: TextAnchor
# Default value: LowerLeft
# Acceptable values: UpperLeft, UpperCenter, UpperRight, MiddleLeft, MiddleCenter, MiddleRight, LowerLeft, LowerCenter, LowerRight
Quick Slots Anchor = LowerLeft

## The position offset from the Quick Slots Anchor at which to place the Quick Slots.
# Setting type: Vector2
# Default value: {"x":216.0,"y":150.0}
Quick Slots Position = {"x":216.0,"y":150.0}

## Number of quick slots available.
# Setting type: Int32
# Default value: 3
# Acceptable value range: From 0 to 6
Quick Slot Count = 3

[Toggles]

## Enable to view the raw legacy save data in the compendium.
# Setting type: Boolean
# Default value: false
View Debug Save Data = false

## Enable the equipment slots. Disabling this while items are equipped will attempt to move them to your inventory.
# Setting type: Boolean
# Default value: true
Enable Equipment Slots = true

## Enable the quick slots. Disabling this while items are in the slots will attempt to move them to your inventory.
# Setting type: Boolean
# Default value: true
Enable Quick Slots = true

