## Myriad modpack — Jewelcrafting layout (Option A)
## Plugin GUID: org.bepinex.plugins.jewelcrafting
##
## Pins JC 2.0 paperdoll defaults: Megingjord hosts utility-lane gems (wisplight,
## wishbone, stock JC utility effects). Ring and neck are dedicated slots.
## Myriad stones never use utility — see src/MyriadJewels/README.md.
##
## Other JC settings use plugin defaults on first launch; the game may expand this
## file after you play.

[7 - Other]

## If on, the Wisplight is a gem for utility items, instead of a utility item itself.
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
Wisplight Gem = On

## If on, the Wishbone is a gem for utility items, instead of a utility item itself.
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
Wishbone Gem = On

## If on, the Jewelcrafting rings do not go into the utility slot, but get a special dedicated ring slot.
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
Ring Slot = On

## If on, the Jewelcrafting necklaces do not go into the utility slot, but get a special dedicated necklace slot.
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
Necklace Slot = On

## If on, the sockets in utility, necklace and ring slots are split, if multiple items are equipped.
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
Split Sockets = On
